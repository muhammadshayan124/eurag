# Throwaway local databases for the vector-store comparison. Bound to loopback only; the
# credentials below are for these disposable containers and protect nothing.
services:
  pgvector:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ["127.0.0.1:5544:5432"]
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports: ["127.0.0.1:6334:6333"]
