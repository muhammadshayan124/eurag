[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eurag"
version = "0.1.0"
description = "Retrieval benchmark over EU digital regulation: BM25 vs dense vs hybrid, article vs paragraph chunking, pgvector vs Qdrant, on a hand-labelled question set"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "lxml>=5.0",
    "httpx>=0.27",
    "fastembed>=0.3",
    "qdrant-client>=1.9",
    "psycopg[binary]>=3.1",
    "typer>=0.12",
    "rich>=13.7",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
eurag = "eurag.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B905", "E501"]
